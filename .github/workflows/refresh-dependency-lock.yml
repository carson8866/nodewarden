name: Refresh dependency lock for hardening
on:
  push:
    branches:
      - dependency-hardening-2026-10-07
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact lock
        run: npm ci
      - name: Full verification
        run: npm run verify
      - name: Commit refreshed lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile after dependency hardening"
          git push
